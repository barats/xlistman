version: 2

project_name: xlistman

# The web UI is embedded into the binary via go:embed, so build the SvelteKit
# frontend before the Go builds (requires Node.js + pnpm on the release
# runner — see .github/workflows/release.yml).
before:
  hooks:
    - cd web && pnpm install --frozen-lockfile && pnpm build

builds:
  - env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/barats/xlistman/cmd.Version={{.Version}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: barats
    name: xlistman
