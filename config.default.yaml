# xListman default configuration.
#
# This file is a minimal, runnable starting point. It is baked into the
# Docker image (as /etc/xlistman/config.yaml) and documented in the README.
# For a full commented reference, run `xlistman config init`.
#
# Every value can be overridden with an XLISTMAN_-prefixed environment
# variable (see internal/config/config.go), and ${ENV_VAR} syntax expands
# secrets from the environment.

http:
  listen: ":8080"
lmtp:
  listen: ":8024"
socket:
  # /tmp rather than /var/run: writable in the scratch container image and on
  # single-user setups. Override for multi-user systems.
  path: "/tmp/xlistman.sock"
database:
  path: "./xlistman.db"
smtp:
  host: "localhost"
  port: 25
  # "smtp" (relay via the host above) or "sink" (write outbound mail to
  # sink_dir for development without an MTA).
  mode: "smtp"
  sink_dir: "./mail"
  # Transport security for outbound mail: "none", "starttls" (opportunistic,
  # the default), "starttls-required", or "implicit" (TLS from the first byte,
  # e.g. port 465). Username/password are only ever sent over an encrypted
  # connection.
  tls: "starttls"
  # Disable certificate verification for relays with self-signed or
  # private-CA certificates. Off by default.
  tls_insecure_skip_verify: false
web:
  # The public origin users see in emails (must start with http:// or https://).
  base_url: "http://localhost:8080"
  # The instance name used in page titles, the web UI header/footer, and
  # social tags.
  site_name: "xListman"
rate_limits:
  subscribe_per_hour: 5
  magic_link_per_hour: 3
  magic_link_per_ip_per_hour: 50
  posts_per_hour: 10
queue:
  max_retries: 8
