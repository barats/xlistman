# Exim configuration for the xListman LMTP-loop validation.
# User-space instance: daemon on 127.0.0.1:2525, spool + logs under validate/.
# Run from the repo root via:  validate/exim/start-exim.sh
# Stop via:                    validate/exim/stop-exim.sh
# Loopback routing setup (root): validate/exim/start-loopback.sh

primary_hostname = bMacAir.local

# Run as the invoking user (no root); otherwise exim switches to its
# compiled-in exim uid and the daemon cannot start as a non-root user.
exim_user = barat
trusted_users = barat

# --- Paths (macros: start-exim.sh overrides with absolute -D values, because
# the daemon chdirs on startup and requires absolute pid/socket paths) ---
SPOOLDIR = ./validate/exim/spool
LOGDIR = ./validate/exim/log
MAILDIR = ./validate/exim/mail
PIDFILE = ./validate/exim/spool/exim-daemon.pid

spool_directory = SPOOLDIR
log_file_path = LOGDIR/%slog
pid_file_path = PIDFILE

# --- Listen on loopback only, high port (no root) ---
local_interfaces = 127.0.0.1
daemon_smtp_ports = 2525
tls_advertise_hosts =

# --- Accept everything from the loopback submission path ---
acl_smtp_mail = accept
acl_smtp_rcpt = accept
acl_smtp_data = accept

# --- Routers (in order) ---
begin routers

# Any local part in the xListman domain goes to xListman over LMTP; the full
# listname+role@domain address is passed through unchanged.
#
# The target is lists.lmtp.local -> 127.0.0.2 (a loopback alias set up by
# start-loopback.sh, plus an /etc/hosts entry so no DNS is involved). A plain
# route to 127.0.0.1 is refused: exim treats its own SMTP interface as "the
# local host" and blocks remote delivery to it as a loop guard, and no router
# option overrides that. 127.0.0.2 is not in local_interfaces, so the guard
# does not fire.
xlistman_lmtp:
  driver = manualroute
  domains = lists.test
  route_list = * lists.lmtp.local
  transport = xlistman_lmtp

# deadbeat@localhost is routed to a transport that always fails delivery, so
# exim accepts the recipient but bounces the DSN to the VERP envelope sender.
# Must precede local_delivery. (Unknown users would otherwise be rejected at
# RCPT time, exercising the queue-retry path instead of the LMTP reverse leg.)
# The target path is a constant: $local_part is tainted (from the envelope)
# and exim forbids tainted data in file paths.
deadbeat_fail:
  driver = accept
  domains = localhost
  local_parts = deadbeat
  transport = deadbeat_fail

# Local delivery into a disposable mbox file under validate/. A single mbox
# (constant path) rather than a per-user path: only barat@localhost receives
# real local mail, and $local_part is tainted (see deadbeat_fail).
local_delivery:
  driver = accept
  domains = localhost
  transport = local_delivery

# --- Transports ---
begin transports

# Network LMTP: the standalone `lmtp` transport driver is for LMTP over a Unix
# socket or command; for TCP LMTP use the smtp transport with protocol = lmtp.
xlistman_lmtp:
  driver = smtp
  protocol = lmtp
  port = 8024
  allow_localhost = true

# Always fails delivery with a permanent error (exit code 1), so exim
# immediately bounces a DSN to the VERP envelope sender. appendfile to a
# nonexistent path was only a *transient* failure (defer + retry).
deadbeat_fail:
  driver = pipe
  command = /usr/bin/false

local_delivery:
  driver = appendfile
  file = MAILDIR/mailbox
  create_directory

# --- Retry: bound retries so a failing delivery bounces promptly ---
begin retry
*  *  F,5m,2m; G,16h,1h,1.5; F,4d,6h
