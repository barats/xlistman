# xListman validation fixture for the LMTP loop against local Postfix.
# Postfix must be running with lists.test routed to LMTP (start-postfix.sh).
# Set XLISTMAN_CONFIG=validate/postfix/postfix-validate.yaml when running the
# daemon and CLI commands.
http:
    listen: 127.0.0.1:8081
lmtp:
    listen: 127.0.0.1:8024
socket:
    path: ./validate/postfix/postfix.sock
database:
    path: ./validate/postfix/postfix.db
smtp:
    host: localhost
    port: 25
    username: ""
    password: ""
    mode: smtp
    sink_dir: /tmp/xlistman-mail
web:
    base_url: http://127.0.0.1:8081
rate_limits:
    subscribe_per_hour: 100
    magic_link_per_hour: 100
    posts_per_hour: 100
queue:
    max_retries: 8
